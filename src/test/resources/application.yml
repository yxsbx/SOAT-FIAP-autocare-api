spring:
  datasource:
    url: jdbc:h2:mem:autocarehub;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      fail-on-unknown-properties: true

security:
  jwt:
    secret: test-jwt-secret-with-at-least-32-bytes
    expiration-minutes: 60

app:
  external-service:
    token: test-external-service-token

logging:
  level:
    org.springdoc.core.events.SpringDocAppInitializer: ERROR
