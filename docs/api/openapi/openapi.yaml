openapi: 3.0.3
info:
  title: AutoCare Hub API
  version: 1.0.0
  description: >
    API para gerenciamento de clientes, veículos, serviços, peças, ordens de
    serviço, orçamentos, aprovações e acompanhamento de status de uma oficina
    mecânica.
servers:
  - url: http://localhost:8080
    description: Ambiente local
security:
  - bearerAuth: [ ]
tags:
  - name: Auth
    description: Autenticação e emissão de token JWT
  - name: Customers
    description: Cadastro e manutenção de clientes
  - name: Vehicles
    description: Cadastro e manutenção de veículos
  - name: Workshop Services
    description: Cadastro e manutenção dos serviços oferecidos pela oficina
  - name: Parts
    description: Cadastro, manutenção e controle de estoque de peças e insumos
  - name: Service Orders
    description: Criação, composição, orçamento, aprovação e acompanhamento de ordens de serviço
  - name: Users
    description: Conta do usuário autenticado, funcionários, permissões e preferências de home
  - name: Demo Leads
    description: Registro publico e consulta administrativa de interessados em parceria
paths:
  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: Autentica um usuário
      operationId: login
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              admin:
                summary: Login administrativo para testar CRUDs e OS
                value:
                  username: admin@autocarehub.com
                  password: autocare123
              customer:
                summary: Login de cliente para testar acompanhamento da própria OS
                value:
                  username: cliente@autocarehub.com
                  password: autocare123
      responses:
        '200':
          description: Login realizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/customers:
    post:
      tags:
        - Customers
      summary: Cria um cliente
      operationId: createCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
            examples:
              pessoaFisica:
                summary: Cliente pessoa física com CPF válido
                value:
                  name: Yasmin Barcelos
                  document: '52998224725'
                  phone: '11987654321'
                  email: yasmin.cliente@example.com
                  address:
                    street: Avenida Paulista
                    number: '1000'
                    complement: Sala 10
                    neighborhood: Bela Vista
                    city: São Paulo
                    state: SP
                    zipCode: 01310-100
              pessoaJuridica:
                summary: Cliente empresa com CNPJ válido
                value:
                  name: Oficina Parceira Ltda
                  document: '11222333000181'
                  phone: '1133332222'
                  email: contato@oficinaparceira.com.br
                  address:
                    street: Rua Vergueiro
                    number: '1500'
                    neighborhood: Vila Mariana
                    city: São Paulo
                    state: SP
                    zipCode: 04101-000
      responses:
        '201':
          description: Cliente criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags:
        - Customers
      summary: Lista clientes
      operationId: listCustomers
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: active
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Clientes encontrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/customers/{customerId}:
    get:
      tags:
        - Customers
      summary: Busca um cliente por id
      operationId: getCustomerById
      parameters:
        - $ref: '#/components/parameters/CustomerIdPathParam'
      responses:
        '200':
          description: Cliente encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Customers
      summary: Atualiza um cliente
      operationId: updateCustomer
      parameters:
        - $ref: '#/components/parameters/CustomerIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'
            examples:
              atualizarCliente:
                summary: Atualiza cliente mantendo ativo
                value:
                  name: Mariana Costa
                  document: '12345678909'
                  phone: '11988887777'
                  email: mariana.costa@example.com
                  address:
                    street: Rua das Oficinas
                    number: '120'
                    neighborhood: Centro
                    city: São Paulo
                    state: SP
                    zipCode: 01001-000
                  active: true
      responses:
        '200':
          description: Cliente atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Customers
      summary: Remove logicamente um cliente
      operationId: deleteCustomer
      parameters:
        - $ref: '#/components/parameters/CustomerIdPathParam'
      responses:
        '204':
          description: Cliente removido
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/customers/{customerId}/vehicles:
    get:
      tags:
        - Vehicles
      summary: Lista veículos de um cliente
      operationId: listVehiclesByCustomer
      parameters:
        - $ref: '#/components/parameters/CustomerIdPathParam'
      responses:
        '200':
          description: Veículos encontrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/customers/{customerId}/service-orders:
    get:
      tags:
        - Service Orders
      summary: Lista ordens de serviço de um cliente
      operationId: listServiceOrdersByCustomer
      parameters:
        - $ref: '#/components/parameters/CustomerIdPathParam'
      responses:
        '200':
          description: Ordens de serviço encontradas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrderListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/vehicles:
    post:
      tags:
        - Vehicles
      summary: Cria um veículo
      operationId: createVehicle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVehicleRequest'
            examples:
              veiculoClienteSeed:
                summary: Veículo novo vinculado a cliente existente
                value:
                  customerId: 10000000-0000-0000-0000-000000000001
                  plate: TST1A23
                  brand: Honda
                  model: Civic Touring
                  year: 2021
                  mileage: 42000
      responses:
        '201':
          description: Veículo criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      tags:
        - Vehicles
      summary: Lista veículos
      operationId: listVehicles
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: active
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Veículos encontrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/vehicles/{vehicleId}:
    get:
      tags:
        - Vehicles
      summary: Busca um veículo por id
      operationId: getVehicleById
      parameters:
        - $ref: '#/components/parameters/VehicleIdPathParam'
      responses:
        '200':
          description: Veículo encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Vehicles
      summary: Atualiza um veículo
      description: >
        Atualiza quilometragem e status ativo do veículo. Para preservar histórico de OS, placa, marca, modelo e ano
        devem permanecer iguais aos dados já cadastrados; se esses dados estiverem incorretos, inative o veículo e crie
        um novo cadastro.
      operationId: updateVehicle
      parameters:
        - $ref: '#/components/parameters/VehicleIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVehicleRequest'
            examples:
              atualizarVeiculo:
                summary: Atualiza veículo e mantém ativo
                value:
                  customerId: 10000000-0000-0000-0000-000000000001
                  plate: TST1A23
                  brand: Honda
                  model: Civic Touring
                  year: 2021
                  mileage: 42500
                  active: true
      responses:
        '200':
          description: Veículo atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Vehicles
      summary: Remove logicamente um veículo
      operationId: deleteVehicle
      parameters:
        - $ref: '#/components/parameters/VehicleIdPathParam'
      responses:
        '204':
          description: Veículo removido
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/workshop-services:
    post:
      tags:
        - Workshop Services
      summary: Cria um serviço da oficina
      operationId: createWorkshopService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkshopServiceRequest'
            examples:
              diagnostico:
                summary: Serviço de diagnóstico para catálogo da oficina
                value:
                  name: Diagnostico eletrico avancado
                  description: Verificação de alternador, bateria, chicote e modulos eletronicos.
                  basePrice: 250.00
                  estimatedTimeInMinutes: 120
      responses:
        '201':
          description: Serviço criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkshopServiceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags:
        - Workshop Services
      summary: Lista serviços da oficina
      operationId: listWorkshopServices
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: active
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Serviços encontrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkshopServiceListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/workshop-services/{serviceId}:
    get:
      tags:
        - Workshop Services
      summary: Busca um serviço da oficina por id
      operationId: getWorkshopServiceById
      parameters:
        - $ref: '#/components/parameters/ServiceIdPathParam'
      responses:
        '200':
          description: Serviço encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkshopServiceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Workshop Services
      summary: Atualiza um serviço da oficina
      operationId: updateWorkshopService
      parameters:
        - $ref: '#/components/parameters/ServiceIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkshopServiceRequest'
            examples:
              atualizarServico:
                summary: Atualiza serviço mantendo ativo
                value:
                  name: Diagnostico eletrico avancado
                  description: Verificação de alternador, bateria, chicote, fusivel e modulos eletronicos.
                  basePrice: 280.00
                  estimatedTimeInMinutes: 150
                  active: true
      responses:
        '200':
          description: Serviço atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkshopServiceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Workshop Services
      summary: Remove logicamente um serviço da oficina
      operationId: deleteWorkshopService
      parameters:
        - $ref: '#/components/parameters/ServiceIdPathParam'
      responses:
        '204':
          description: Serviço removido
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/parts:
    post:
      tags:
        - Parts
      summary: Cria uma peça ou insumo
      operationId: createPart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePartRequest'
            examples:
              peca:
                summary: Peça com estoque inicial
                value:
                  name: Sensor de oxigenio universal
                  description: Sensor lambda universal para diagnostico de mistura ar-combustivel.
                  sku: MOT-SEN-OXI01
                  category: Motor
                  subcategory: Injeção
                  brand: Bosch
                  unitPrice: 320.00
                  costPrice: 210.00
                  stockQuantity: 12
                  minimumStock: 3
      responses:
        '201':
          description: Peça criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags:
        - Parts
      summary: Lista peças e insumos
      operationId: listParts
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: active
          in: query
          required: false
          schema:
            type: boolean
        - name: lowStock
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Peças encontradas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/parts/{partId}:
    get:
      tags:
        - Parts
      summary: Busca uma peça por id
      operationId: getPartById
      parameters:
        - $ref: '#/components/parameters/PartIdPathParam'
      responses:
        '200':
          description: Peça encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Parts
      summary: Atualiza uma peça ou insumo
      operationId: updatePart
      parameters:
        - $ref: '#/components/parameters/PartIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePartRequest'
            examples:
              atualizarPeca:
                summary: Atualiza peça mantendo ativa
                value:
                  name: Sensor de oxigenio universal
                  description: Sensor lambda universal para diagnostico de mistura ar-combustivel.
                  sku: MOT-SEN-OXI01
                  category: Motor
                  subcategory: Injeção
                  brand: Bosch
                  unitPrice: 340.00
                  costPrice: 220.00
                  stockQuantity: 12
                  minimumStock: 3
                  active: true
      responses:
        '200':
          description: Peça atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Parts
      summary: Remove logicamente uma peça ou insumo
      operationId: deletePart
      parameters:
        - $ref: '#/components/parameters/PartIdPathParam'
      responses:
        '204':
          description: Peça removida
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/parts/{partId}/stock:
    patch:
      tags:
        - Parts
      summary: Atualiza o estoque de uma peça ou insumo
      operationId: updatePartStock
      parameters:
        - $ref: '#/components/parameters/PartIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePartStockRequest'
            examples:
              ajusteEstoque:
                summary: Ajuste direto da quantidade total em estoque
                value:
                  stockQuantity: 25
      responses:
        '200':
          description: Estoque atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/parts/{partId}/stock-movement:
    patch:
      tags:
        - Parts
      summary: Registra entrada, saída ou venda isolada de uma peça
      operationId: registerStockMovement
      parameters:
        - $ref: '#/components/parameters/PartIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockMovementRequest'
            examples:
              entradaCompra:
                summary: Entrada de compra de fornecedor
                value:
                  type: ENTRY
                  quantity: 10
                  unitCost: 210.00
                  unitPrice: 320.00
                  reason: Compra de reposição de estoque
              saídaInterna:
                summary: Saída manual de estoque
                value:
                  type: EXIT
                  quantity: 1
                  reason: Ajuste por perda operacional
      responses:
        '200':
          description: Movimento registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/parts/{partId}/reservation:
    patch:
      tags:
        - Parts
      summary: Configura o prazo de reserva de estoque para orçamentos
      operationId: configurePartReservation
      parameters:
        - $ref: '#/components/parameters/PartIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigurePartReservationRequest'
            examples:
              prazoReserva:
                summary: Prazo de reserva usado em orçamentos
                value:
                  reservationDays: 3
      responses:
        '200':
          description: Prazo de reserva configurado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/parts/{partId}/reserve:
    patch:
      tags:
        - Parts
      summary: Bloqueia quantidade de uma peça para um orçamento
      operationId: reservePart
      parameters:
        - $ref: '#/components/parameters/PartIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartQuantityRequest'
            examples:
              reservar:
                summary: Reserva quantidade para orçamento
                value:
                  quantity: 2
      responses:
        '200':
          description: Estoque reservado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/parts/{partId}/release-reservation:
    patch:
      tags:
        - Parts
      summary: Libera quantidade previamente reservada
      operationId: releaseReservation
      parameters:
        - $ref: '#/components/parameters/PartIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartQuantityRequest'
            examples:
              liberarReserva:
                summary: Libera quantidade reservada
                value:
                  quantity: 1
      responses:
        '200':
          description: Reserva liberada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/parts/{partId}/commit-reservation:
    patch:
      tags:
        - Parts
      summary: Converte reserva em baixa definitiva de estoque
      operationId: commitReservation
      parameters:
        - $ref: '#/components/parameters/PartIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitPartReservationRequest'
            examples:
              baixarReserva:
                summary: Converte reserva em baixa de estoque
                value:
                  quantity: 1
                  reason: Peca utilizada na execução da OS
      responses:
        '200':
          description: Reserva baixada do estoque
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/service-orders:
    post:
      tags:
        - Service Orders
      summary: Cria uma ordem de serviço identificando o cliente por CPF ou CNPJ
      description: >
        Abre uma Ordem de Serviço recebendo dados do cliente, veículo, serviços e peças/insumos.
        Retorna o identificador único da OS no campo `id`.
      operationId: createServiceOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceOrderRequest'
            examples:
              clienteVeiculoExistentes:
                summary: OS para cliente e veículo já cadastrados
                description: Use este exemplo depois de autenticar como admin. Ele já gera orçamento automaticamente.
                value:
                  customerDocument: '12345678909'
                  vehicleId: 20000000-0000-0000-0000-000000000001
                  diagnosticNotes: Cliente relata ruido ao frear e vibração no pedal.
                  services:
                    - serviceId: 30000000-0000-0000-0000-000000000004
                      quantity: 1
                  parts:
                    - partId: 40000000-0000-0000-0000-000000000005
                      quantity: 1
                    - partId: 40000000-0000-0000-0000-000000000007
                      quantity: 1
                  generateBudget: true
              clienteVeiculoNovos:
