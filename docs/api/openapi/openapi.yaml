      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HomePreferenceRequest'
            example:
              widgets:
                - orders-progress
                - active-customers
                - vehicles-in-service
              showAlertsOnHome: true
      responses:
        '200':
          description: Preferência salva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomePreferenceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/users:
    get:
      tags:
        - Users
      summary: Lista contas de usuário
      description: >
        Endpoint administrativo para listar usuários por status, role, perfil ou termo de busca.
        Requer Bearer Token JWT de administrador.
      operationId: listUsers
      parameters:
        - name: active
          in: query
          required: false
          schema:
            type: boolean
        - name: role
          in: query
          required: false
          schema:
            type: string
            example: ADMIN
        - name: profileType
          in: query
          required: false
          schema:
            type: string
            example: WORKSHOP_ADMIN
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
      responses:
        '200':
          description: Usuários encontrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Users
      summary: Cria uma conta de usuário
      description: >
        Endpoint administrativo para criar administradores, funcionários ou clientes vinculados ao sistema.
        Requer Bearer Token JWT de administrador. IDs de usuário e de empresa nova são gerados pelo backend.
        Para vincular uma conta a empresa existente, consulte antes `GET /api/v1/users/companies` e use a empresa selecionada.
        Para criar uma empresa nova, envie `createCompany: true`, `companyName` e `companyType`, sem informar `companyId`.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            examples:
              funcionarioEmpresaExistente:
                summary: Funcionário em empresa existente selecionada
                value:
                  username: mecanico@example.com
                  password: 'autocare123'
                  role: EMPLOYEE
                  fullName: Carlos Oficina
                  profileType: WORKSHOP_EMPLOYEE
                  companyId: 90000000-0000-0000-0000-000000000011
                  companyName: Oficina Central AutoCare
                  companyType: WORKSHOP
                  createCompany: false
                  employeeSubRole: MECHANIC
                  permissions:
                    - CREATE_ORDER
                    - EDIT_ORDER
                  active: true
              adminNovaEmpresa:
                summary: Admin Master criando nova oficina sem informar id
                value:
                  username: nova.oficina@example.com
                  password: 'autocare123'
                  role: ADMIN
                  fullName: Ana Oficina
                  profileType: WORKSHOP_ADMIN
                  companyName: Oficina Nova AutoCare
                  companyType: WORKSHOP
                  createCompany: true
                  employeeSubRole: ''
                  permissions:
                    - VIEW_BILLING
                    - MANAGE_STOCK
                    - CREATE_BUDGET
                    - EDIT_EMPLOYEES
                    - VIEW_STATS
                  active: true
      responses:
        '201':
          description: Usuário criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/users/partners:
    get:
      tags:
        - Users
      summary: Lista parceiros ativos
      description: Lista oficinas e lojas de peças cadastradas como parceiros ativos para uso na area do cliente final.
      operationId: listPartners
      responses:
        '200':
          description: Parceiros encontrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/users/companies:
    get:
      tags:
        - Users
      summary: Lista empresas disponíveis para vínculo de usuários
      description: >
        Endpoint administrativo usado no cadastro de contas. Admin Master visualiza todas as empresas.
        Admin de oficina ou loja visualiza somente a própria empresa.
      operationId: listCompaniesForUsers
      responses:
        '200':
          description: Empresas encontradas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyListResponse'
              example:
                items:
                  - id: 90000000-0000-0000-0000-000000000001
                    name: AutoCare Hub
                    type: PLATFORM
                    active: true
                  - id: 90000000-0000-0000-0000-000000000011
                    name: Oficina Central AutoCare
                    type: WORKSHOP
                    active: true
                  - id: 90000000-0000-0000-0000-000000000012
                    name: Loja peças Prime
                    type: PARTS_STORE
                    active: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/users/{userId}:
    put:
      tags:
        - Users
      summary: Atualiza uma conta de usuário
      description: Endpoint administrativo para editar dados, perfil, subrole, permissões e status ativo de uma conta.
      operationId: updateUser
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Usuário atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/users/{userId}/password:
    patch:
      tags:
        - Users
      summary: Redefine a senha de uma conta
      description: >
        Endpoint administrativo para definir nova senha inicial ou resetar senha de funcionário, cliente ou parceiro.
      operationId: resetUserPassword
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Senha redefinida
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/demo-leads:
    post:
      tags:
        - Demo Leads
      summary: Registra interesse em parceria
      description: >
        Endpoint publico usado pela pagina de parceiros para registrar oficinas ou lojas interessadas em demonstração.
      operationId: registerDemoLead
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoLeadRequest'
            example:
              contactName: Ana Oficina
              companyName: Oficina Central AutoCare
              demoProfile: workshop
              email: ana@example.com
              phone: '11999999999'
              cnpj: '11.222.333/0001-81'
              city: Sao Paulo
              message: Quero conhecer a plataforma.
      responses:
        '201':
          description: Interesse registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoLeadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
        - Demo Leads
      summary: Lista interessados em parceria
      description: >
        Endpoint administrativo para Admin Master acompanhar interessados, contatos e parceiros potenciais.
        Requer Bearer Token JWT de administrador.
      operationId: listDemoLeads
      responses:
        '200':
          description: Interessados encontrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DemoLeadResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    SizeParam:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    CustomerIdPathParam:
      name: customerId
      in: path
      required: true
      example: 10000000-0000-0000-0000-000000000001
      schema:
        type: string
        format: uuid
    VehicleIdPathParam:
      name: vehicleId
      in: path
      required: true
      example: 20000000-0000-0000-0000-000000000001
      schema:
        type: string
        format: uuid
    ServiceIdPathParam:
      name: serviceId
      in: path
      required: true
      example: 30000000-0000-0000-0000-000000000004
      schema:
        type: string
        format: uuid
    PartIdPathParam:
      name: partId
      in: path
      required: true
      example: 40000000-0000-0000-0000-000000000005
      schema:
        type: string
        format: uuid
    ServiceOrderIdPathParam:
      name: serviceOrderId
      in: path
      required: true
      example: 50000000-0000-0000-0000-000000000002
      schema:
        type: string
        format: uuid
    ExternalServiceTokenHeaderParam:
      name: X-External-Service-Token
      in: header
      required: true
      description: Token compartilhado configurado em `EXTERNAL_SERVICE_TOKEN` para webhooks externos simulados.
      schema:
        type: string
        minLength: 1
  responses:
    BadRequest:
      description: Requisição invalida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: '2026-06-20T17:00:00-03:00'
            status: 400
            error: Bad Request
            message: Invalid request body
            path: /api/v1/service-orders
            details:
              - customerDocument: must not be blank
    Unauthorized:
      description: Credenciais ausentes ou invalidas
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: '2026-06-20T17:00:00-03:00'
            status: 401
            error: Unauthorized
            message: Missing or invalid credentials
            path: /api/v1/customers
            details: [ ]
    Forbidden:
      description: Usuário autenticado sem permissão para acessar o recurso, ou token externo ausente/invalido nos webhooks simulados
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: '2026-06-20T17:00:00-03:00'
            status: 403
            error: Forbidden
            message: Access denied
            path: /api/v1/customers
            details: [ ]
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: '2026-06-20T17:00:00-03:00'
            status: 404
            error: Not Found
            message: Resource not found
            path: /api/v1/customers/00000000-0000-0000-0000-000000000000
            details: [ ]
    Conflict:
      description: Conflito com estado atual do recurso, como duplicidade de documento, placa, usuário ou SKU
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: '2026-06-20T17:00:00-03:00'
            status: 409
            error: Conflict
            message: Resource already exists
            path: /api/v1/customers
            details: [ ]
    InternalServerError:
      description: Erro interno inesperado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: '2026-06-20T17:00:00-03:00'
            status: 500
            error: Internal Server Error
            message: Unexpected error
            path: /api/v1/service-orders
            details: [ ]
  schemas:
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 120
          example: admin@autocarehub.com
        password:
          type: string
          minLength: 8
          maxLength: 72
          format: password
          example: 'autocare123'
    LoginResponse:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresIn
      properties:
        accessToken:
          type: string
          minLength: 1
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          format: int64
          minimum: 1
          example: 3600
    Address:
      type: object
      required:
        - street
        - number
        - neighborhood
        - city
        - state
        - zipCode
      properties:
        street:
          type: string
          minLength: 2
          maxLength: 120
          example: Avenida Paulista
        number:
          type: string
          minLength: 1
          maxLength: 20
          example: '1000'
        complement:
          type: string
          maxLength: 80
          example: Sala 10
        neighborhood:
          type: string
          minLength: 2
          maxLength: 80
          example: Bela Vista
        city:
          type: string
          minLength: 2
          maxLength: 80
          example: Sao Paulo
        state:
          type: string
          minLength: 2
          maxLength: 2
          example: SP
        zipCode:
          type: string
          minLength: 8
          maxLength: 9
          pattern: "^\\d{5}-?\\d{3}$"
          example: 01310-100
    CreateCustomerRequest:
      type: object
      required:
        - name
        - document
        - phone
        - email
        - address
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        document:
          type: string
          minLength: 11
          maxLength: 18
          pattern: "^\\d{11}$|^\\d{14}$|^\\d{3}\\.\\d{3}\\.\\d{3}-\\d{2}$|^\\d{2}\\.\\d{3}\\.\\d{3}/\\d{4}-\\d{2}$"
          description: CPF ou CNPJ com ou sem formatação.
        phone:
          type: string
          minLength: 10
          maxLength: 20
        email:
          type: string
          format: email
          maxLength: 120
        address:
          $ref: '#/components/schemas/Address'
    UpdateCustomerRequest:
      allOf:
        - $ref: '#/components/schemas/CreateCustomerRequest'
        - type: object
          required:
            - active
          properties:
            active:
              type: boolean
    CustomerResponse:
      type: object
      required:
        - id
        - name
        - document
        - phone
        - email
        - address
        - active
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        document:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        address:
          $ref: '#/components/schemas/Address'
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
    CustomerListResponse:
      type: object
      required:
        - items
        - page
        - size
        - totalItems
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CustomerResponse'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalItems:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    CreateVehicleRequest:
      type: object
      required:
        - customerId
        - plate
        - brand
        - model
        - year
        - mileage
      properties:
        customerId:
          type: string
          format: uuid
        plate:
          type: string
          minLength: 7
          maxLength: 8
          pattern: '^[A-Za-z]{3}-?[0-9]{4}$|^[A-Za-z]{3}-?[0-9][A-Za-z][0-9]{2}$'
          example: ABC1D23
        brand:
          type: string
          minLength: 2
          maxLength: 60
        model:
          type: string
          minLength: 1
          maxLength: 80
        year:
          type: integer
          minimum: 1900
          maximum: 2100
        mileage:
          type: integer
          minimum: 0
    UpdateVehicleRequest:
      description: >
        Payload completo mantido por compatibilidade com o formulário administrativo. Em atualização, `plate`, `brand`,
        `model` e `year` devem repetir os dados atuais do veículo; somente `mileage` e `active` são mutáveis.
      allOf:
        - $ref: '#/components/schemas/CreateVehicleRequest'
        - type: object
          required:
            - active
          properties:
            active:
              type: boolean
    VehicleResponse:
      type: object
      required:
        - id
        - customerId
        - plate
        - brand
        - model
        - year
        - mileage
        - active
      properties:
        id:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        plate:
          type: string
        brand:
          type: string
        model:
          type: string
        year:
          type: integer
        mileage:
          type: integer
        active:
          type: boolean
    VehicleListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VehicleResponse'
    CreateWorkshopServiceRequest:
      type: object
      required:
        - name
        - description
        - basePrice
        - estimatedTimeInMinutes
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          minLength: 5
          maxLength: 500
        basePrice:
          type: number
          format: double
          minimum: 0
        estimatedTimeInMinutes:
          type: integer
          minimum: 1
    UpdateWorkshopServiceRequest:
      allOf:
        - $ref: '#/components/schemas/CreateWorkshopServiceRequest'
        - type: object
          required:
            - active
          properties:
            active:
              type: boolean
    WorkshopServiceResponse:
      type: object
      required:
        - id
        - name
        - description
        - basePrice
        - estimatedTimeInMinutes
        - active
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        basePrice:
          type: number
          format: double
        estimatedTimeInMinutes:
          type: integer
        active:
          type: boolean
    WorkshopServiceListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkshopServiceResponse'
    CreatePartRequest:
      type: object
      required:
        - name
        - description
        - sku
        - category
        - brand
        - unitPrice
        - stockQuantity
        - minimumStock
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        description:
          type: string
          minLength: 3
          maxLength: 500
        sku:
          type: string
          minLength: 3
          maxLength: 60
        category:
          type: string
          minLength: 2
          maxLength: 80
        subcategory:
          type: string
          maxLength: 80
        brand:
          type: string
          minLength: 2
          maxLength: 80
        unitPrice:
          type: number
          format: double
          minimum: 0
        costPrice:
          type: number
          format: double
          minimum: 0
        stockQuantity:
          type: integer
          minimum: 0
        minimumStock:
          type: integer
          minimum: 0
    UpdatePartRequest:
      allOf:
        - $ref: '#/components/schemas/CreatePartRequest'
        - type: object
          required:
            - active
          properties:
            active:
              type: boolean
    UpdatePartStockRequest:
      type: object
      required:
        - stockQuantity
      properties:
        stockQuantity:
          type: integer
          minimum: 0
    StockMovementRequest:
      type: object
      required:
        - type
        - quantity
      properties:
        type:
          type: string
          enum:
            - ENTRY
            - EXIT
            - SALE
        quantity:
          type: integer
          minimum: 1
        unitCost:
          type: number
          format: double
          minimum: 0
        unitPrice:
          type: number
          format: double
          minimum: 0
        reason:
          type: string
          maxLength: 255
    ConfigurePartReservationRequest:
      type: object
      required:
        - reservationDays
      properties:
        reservationDays:
          type: integer
          minimum: 1
    PartQuantityRequest:
      type: object
      required:
        - quantity
      properties:
        quantity:
          type: integer
          minimum: 1
    CommitPartReservationRequest:
      allOf:
        - $ref: '#/components/schemas/PartQuantityRequest'
        - type: object
          properties:
            reason:
              type: string
              maxLength: 255
    PartResponse:
      type: object
      required:
        - id
        - name
        - description
        - sku
        - category
        - brand
        - unitPrice
        - costPrice
        - stockQuantity
        - reservedQuantity
        - minimumStock
        - stockStatus
        - active
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        sku:
          type: string
        category:
          type: string
        subcategory:
          type: string
        brand:
          type: string
        unitPrice:
          type: number
          format: double
        costPrice:
          type: number
          format: double
        stockQuantity:
          type: integer
        reservedQuantity:
          type: integer
        availableQuantity:
          type: integer
        minimumStock:
          type: integer
        reservationDays:
          type: integer
        reservationExpiresAt:
          type: string
          format: date-time
        stockStatus:
          type: string
        active:
          type: boolean
    PartListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PartResponse'
    CreateServiceOrderRequest:
      type: object
      required:
        - customerDocument
        - diagnosticNotes
        - services
      properties:
        customerDocument:
          type: string
          minLength: 11
          maxLength: 18
          pattern: "^\\d{11}$|^\\d{14}$|^\\d{3}\\.\\d{3}\\.\\d{3}-\\d{2}$|^\\d{2}\\.\\d{3}\\.\\d{3}/\\d{4}-\\d{2}$"
          example: '12345678909'
          description: CPF ou CNPJ do cliente com ou sem formatação. Se o cliente não existir, informe tambem customer.
        customer:
          $ref: '#/components/schemas/CreateServiceOrderCustomerRequest'
        vehicleId:
          type: string
          format: uuid
          description: >
            Identificador de veículo ja cadastrado.
            Se ausente, informe vehicle para cadastro ou vinculo por placa.
        vehicle:
          $ref: '#/components/schemas/CreateServiceOrderVehicleRequest'
        diagnosticNotes:
